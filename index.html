<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥳 My Party</title>
</head>
<body>
    <h1>🎉Party!🎉</h1>
    <h2>📋 Event Planner</h2>
    <form>
        <label>🎈 Event name:</label>
        <input type="text" placeholder="My Birthday 🎂" required>
        <br><br>
        <label>📅 Date:</label>
        <input type="date">
        <br><br>
        <label>🎨 Theme:</label>
        <input type="color">
        <br><br>
        <button type="submit">✅ Submit</button>
        <br><br>
        <button type="reset">🔄 Reset</button>
    </form>
</body>
</html>
